name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions: {}

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body || '', '@claude')) ||
        (github.event_name == 'issues' &&
          (contains(github.event.issue.body || '', '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Check Claude mention
        id: should_run
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          REVIEW_BODY: ${{ github.event.review.body || '' }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
        run: |
          body=""
          case "$EVENT_NAME" in
            issue_comment|pull_request_review_comment)
              body="$COMMENT_BODY"
              ;;
            pull_request_review)
              body="$REVIEW_BODY"
              ;;
            issues)
              body="$ISSUE_TITLE $ISSUE_BODY"
              ;;
          esac

          if [[ "$body" == *"@claude"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No @claude mention found; skipping Claude Code."
          fi

      - name: Harden runner
        if: steps.should_run.outputs.run == 'true'
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Check collaborator write permission
        if: steps.should_run.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actor="${{ github.actor }}"
          perm=$(gh api "repos/${{ github.repository }}/collaborators/${actor}/permission" \
            --jq '.permission' 2>/dev/null || echo "none")
          if [[ "$perm" != "admin" && "$perm" != "write" ]]; then
            echo "Actor ${actor} has '${perm}' permission; write or admin required." >&2
            exit 1
          fi

      - name: Checkout repository
        if: steps.should_run.outputs.run == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        if: steps.should_run.outputs.run == 'true'
        id: claude
        uses: anthropics/claude-code-action@2fee15510437d71399d9139ed60433470484a8fb # v1.0.153
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowedTools Bash(gh pr *)'
