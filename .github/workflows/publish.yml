name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      npm:
        description: "Publish @anchr/sdk to npm"
        required: true
        type: boolean
        default: false
      jsr:
        description: "Publish Deno packages to JSR"
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  verify:
    name: Verify package outputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2

      - name: Install dependencies
        run: deno install --frozen

      - name: Package dry-run
        run: deno task publish:dry-run

      - name: SDK npm build
        run: cd packages/sdk && bun run build

  publish-jsr:
    name: Publish JSR packages
    needs: verify
    if: inputs.jsr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Publish packages
        run: |
          deno publish --config packages/core-runtime/deno.json
          deno publish --config packages/core-cashu/deno.json
          deno publish --config packages/tlsn-toolkit/deno.json
          deno publish --config packages/photo-verification/deno.json
          deno publish --config packages/frost-oracle/deno.json
          deno publish --config packages/cashu-conditional-swap/deno.json
          deno publish --config packages/blossom/deno.json
          deno publish --config packages/bounty/deno.json
          deno publish --config packages/sdk/deno.json

  publish-npm:
    name: Publish npm SDK
    needs: verify
    if: inputs.npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Build SDK
        run: cd packages/sdk && bun run build

      - name: Publish SDK
        run: cd packages/sdk && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
