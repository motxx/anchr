name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      npm:
        description: "Publish @anchr/sdk to npm"
        required: true
        type: boolean
        default: false
      jsr:
        description: "Publish Deno packages to JSR"
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  verify:
    name: Verify package outputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: deno install --frozen

      - name: Package dry-run
        run: deno task publish:dry-run

      - name: Install SDK npm dependencies
        run: cd packages/sdk && bun install --frozen-lockfile

      - name: SDK npm build
        run: cd packages/sdk && bun run build

  publish-jsr:
    name: Publish JSR packages
    needs: verify
    if: inputs.jsr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Publish packages
        run: |
          deno publish --config packages/protocol/deno.json
          deno publish --config packages/sdk/deno.json

  publish-npm:
    name: Publish npm SDK
    needs: verify
    if: inputs.npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install SDK npm dependencies
        run: cd packages/sdk && bun install --frozen-lockfile

      - name: Build SDK
        run: cd packages/sdk && bun run build

      - name: Publish SDK
        run: cd packages/sdk && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
