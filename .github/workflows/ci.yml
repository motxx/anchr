name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2

      - name: Install dependencies (lockfile integrity check)
        run: deno install --frozen

      - name: Setup Rust (for frost-signer)
        uses: dtolnay/rust-toolchain@stable

      - name: Build frost-signer
        run: cd crates/frost-signer && cargo build --release

      - name: Typecheck
        run: deno task check

      - name: Package dry-run
        run: deno task publish:dry-run

      - name: SDK npm build
        run: cd packages/sdk && bun run build

      - name: Cargo dependency audit
        run: |
          cargo install cargo-audit --quiet
          bash scripts/cargo-audit-all.sh

      # Phase 1: Local tests (no Docker)
      - name: Local tests (lint + unit + integration + protocol e2e + frost e2e + scripts + examples + pentest)
        run: deno task test:all

      # Phase 2: Docker-dependent tests
      - name: Start infrastructure (relay + Blossom)
        if: ${{ !cancelled() }}
        run: |
          docker compose up -d relay blossom
          for service in "Nostr relay:http://localhost:7777" "Blossom:http://localhost:3333"; do
            name="${service%%:*}"
            url="${service#*:}"
            echo "Waiting for $name..."
            for i in $(seq 1 30); do
              if curl -sf "$url" > /dev/null 2>&1; then
                echo "$name ready."
                break
              fi
              if [ "$i" = "30" ]; then
                echo "::error::$name not ready at $url"
                docker compose logs relay blossom
                exit 1
              fi
              sleep 2
            done
          done

      - name: Blossom-backed worker API integration
        if: ${{ !cancelled() }}
        run: deno test packages/bounty/src/infrastructure/worker-api.integration.test.ts --allow-env --allow-read --allow-write --allow-net --allow-run --allow-sys
        env:
          BLOSSOM_SERVERS: http://localhost:3333

      - name: E2E tests (relay + Blossom)
        if: ${{ !cancelled() }}
        run: |
          deno task test:e2e:relay
          ANCHR_E2E_REQUIRE_INFRA=1 deno test packages/bounty/src/infrastructure/worker-api.integration.test.ts --allow-env --allow-read --allow-write --allow-net --allow-run --allow-sys
        env:
          NOSTR_RELAYS: ws://localhost:7777
          BLOSSOM_SERVERS: http://localhost:3333

      # Phase 3: Regtest Lightning tests
      - name: Start regtest Lightning stack
        if: ${{ !cancelled() }}
        run: |
          docker compose up -d bitcoind lnd-mint lnd-user
          sleep 5

      - name: Initialize regtest (wait for LND + fund + open channel)
        if: ${{ !cancelled() }}
        run: ./scripts/init-regtest.sh

      - name: Start Cashu mint
        if: ${{ !cancelled() }}
        run: |
          docker compose up -d cashu-mint
          sleep 5
          docker compose restart cashu-mint
          echo "Waiting for Cashu mint..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3338/v1/info > /dev/null 2>&1; then
              echo "Cashu mint ready."
              break
            fi
            if [ "$i" = "20" ]; then
              echo "::error::Cashu mint not ready"
              docker compose logs cashu-mint
              exit 1
            fi
            sleep 3
          done

      - name: Regtest E2E tests (HTLC + Cashu)
        if: ${{ !cancelled() }}
        run: deno task test:e2e:regtest
        env:
          CASHU_MINT_URL: http://localhost:3338
          NOSTR_RELAYS: ws://localhost:7777
          BLOSSOM_SERVERS: http://localhost:3333

      # Phase 4: TLSNotary E2E — boots its own verifier service.
      # Build the local binaries first so this path cannot pass by skipping all
      # proof-producing tests.
      - name: Build TLSN prover
        if: ${{ !cancelled() }}
        run: cd crates/tlsn-prover && cargo build

      - name: Build TLSN verifier CLI
        if: ${{ !cancelled() }}
        run: cd crates/tlsn-verifier && cargo build --release

      - name: Start TLSN verifier
        if: ${{ !cancelled() }}
        run: |
          docker compose up -d tlsn-verifier
          for port in 7046 7047; do
            echo "Waiting for TLSN verifier port $port..."
            for i in $(seq 1 30); do
              if bash -c ":</dev/tcp/localhost/$port" > /dev/null 2>&1; then
                echo "TLSN verifier port $port ready."
                break
              fi
              if [ "$i" = "30" ]; then
                echo "::error::TLSN verifier port $port not ready"
                docker compose logs tlsn-verifier
                exit 1
              fi
              sleep 2
            done
          done

      - name: TLSN E2E tests
        if: ${{ !cancelled() }}
        run: deno task test:e2e:tlsn
        env:
          TLSN_E2E_REQUIRE_CORE: "1"

      - name: Stop infrastructure
        if: always()
        run: docker compose down

      - name: Build deploy image
        run: docker build -t anchr:${{ github.sha }} .
