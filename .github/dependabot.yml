version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # npm (deno.lock / package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    # Supply-chain safety: skip versions released too recently.
    # Newly-published packages are the typical attack window for
    # malicious-publish / token-compromise incidents (e.g. ua-parser-js,
    # event-stream, debug). Wait for community signal before adopting.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 5

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"

  - package-ecosystem: "docker"
    directory: "/crates/tlsn-server"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"

  # Cargo (Rust crates)
  - package-ecosystem: "cargo"
    directory: "/crates/tlsn-server"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "cargo"
    directory: "/crates/tlsn-verifier"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "cargo"
    directory: "/crates/tlsn-prover"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
