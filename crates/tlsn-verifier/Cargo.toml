[package]
name = "anchr-tlsn-verifier"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "tlsn-verifier"
path = "src/main.rs"

[dependencies]
tlsn-attestation = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.14" }
bincode = "1.3"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }

[profile.release]
strip = true
lto = true
