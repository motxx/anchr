app = "anchr-relay"
primary_region = "nrt"

[build]
  # Pinned release — bump deliberately, never float on :latest.
  image = "scsibug/nostr-rs-relay:0.10.0"

[deploy]
  wait_timeout = "5m"

[[mounts]]
  source = "relay_data"
  destination = "/usr/src/app/db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Scale-to-zero is accepted for this dev/test relay: a cold start only
  # delays the first relay connection. A production relay must keep
  # min_machines_running >= 1 so subscriptions and DMs are not dropped
  # while a machine wakes.
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
