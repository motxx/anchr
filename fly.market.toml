app = "anchr-market"
primary_region = "sin"

[build]
  dockerfile = "example/two-party-binary-bet/Dockerfile"

[deploy]
  wait_timeout = "10m"

[env]
  MARKET_PORT = "8080"
  CASHU_MINT_URL = "https://testnut.cashu.space"
  NOSTR_RELAYS = "wss://anchr-relay.fly.dev"
  TLSN_VERIFIER_URL = "https://anchr-tlsn-verifier.fly.dev"
  TLSN_PROXY_URL = "wss://anchr-tlsn-verifier.fly.dev/proxy"
  FROST_MARKET_CONFIG_PATH = "/data/signer-1.json"
  KANNAGI_DB_PATH = "/data/kannagi.db"
  AUTO_RESOLVE_POLL_MS = "60000"

[[mounts]]
  source = "frost_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
